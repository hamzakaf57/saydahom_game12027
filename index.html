                    const targetPlayer = gameState.players.find(p => p.id == targetId);
                    if (targetPlayer && val === targetPlayer.secret) {
                        voter.score += 10;

                    </div>

                    <!-- TikTok Conversion Banner -->
                    <div class="p-3.5 bg-slate-900 border border-slate-800 rounded-2xl text-xs space-y-2">
                        <p class="text-gray-300 font-bold">استمتعتوا باللعبة؟ 🎯</p>
                        <p class="text-[11px] text-gray-400 leading-relaxed">يسعدنا جداً تقييمكم للعبة ومشاركتنا آراءكم عبر حسابنا الرسمي على تيك توك!</p>
                        <a href="http://www.tiktok.com/@hamza_kaf" target="_blank" class="inline-flex items-center justify-center gap-2 w-full py-2 bg-brand-yellow text-brand-navy font-black rounded-xl hover:brightness-110 transition">
                            <i class="fa-brands fa-tiktok"></i> تقييم اللعبة على تيك توك
                        </a>
                    </div>

                    <button onclick="restartFullGame()" class="w-full py-3 bg-slate-800 border border-slate-700 text-gray-300 font-bold rounded-2xl hover:bg-slate-700 transition">
                        لعب مباراة جديدة 🔄
                    </button>
                </div>
            `;
        }

        function restartFullGame() {
            gameState.currentRound = 1;
            gameState.players.forEach(p => p.score = 0);
            gameState.step = 'PLAYERS_SETUP';
            renderScreen();
        }
    </script>
</body>
</html>
