function leg(o,m){const {pts,lg,T}=S.cur,a=T(o),b=T(m);pts[o]+=b-a;pts[m]+=a-b;lg[o].push('التبديل الأسطوري: بدّل مجموعه مع '+nm(m));lg[m].push('التبديل الأسطوري: بدّل مجموعه مع '+nm(o));fin()}
function fin(){const {pts,lg}=S.cur,last=S.r==R-1;if(S.ap!==S.r){S.pl.forEach((_,p)=>S.sc[p]+=pts[p]);S.ap=S.r}
scr(`<h2>نتيجة الجولة ${S.r+1} من ${R}</h2>${S.pl.map((p,i)=>`<div class="cd"><div class="rw" style="border:0;padding:0"><span>${esc(p)} - <b class="y">${esc(S.items[i])}</b></span><b>${pts[i]>0?'+':''}${pts[i]} (المجموع ${S.sc[i]})</b></div>${S.cards[i].t=='v'?`<small class="mu">الكرت: ${S.cards[i].n}</small>`:''}${lg[i].map(x=>`<small class="mu" style="color:#f87171">${x}</small>`).join('')}</div>`).join('')}<div class="cd"><h2>الترتيب المؤقت</h2>${(r=>r.map(x=>`<div class="rw"><span>${1+new Set(r.map(y=>y.s).filter(v=>v>x.s)).size}. ${esc(x.p)}</span><b class="y">${x.s}</b></div>`).join(''))(S.pl.map((p,i)=>({p,s:S.sc[i]})).sort((a,b)=>b.s-a.s))}</div><button class="b1" onclick="${last?'final()':'S.r++;cats()'}">${last?'عرض المراكز 🏆':'الجولة التالية ➔'}</button>`)}
function final(){const m=Math.max(...S.sc),t=S.pl.map((_,i)=>i).filter(i=>S.sc[i]==m);if(t.length>1&&!S.tbd)return tbIntro(t);podium()}
function tbIntro(t){S.tid=t;scr(`<div class="cd c"><div class="hero">⚖️</div><h2>تعادل على الصدارة!</h2><p class="mu" style="color:var(--tx)">${t.map(nm).join(' و ')} متعادلون بـ ${S.sc[t[0]]} نقطة.<br>جولة تعادل بينهم لتحديد البطل.</p></div><button class="b1" onclick="tbGo(0)">ابدأ جولة التعادل</button>`,'none')}
function tbGo(k){const t=S.tid;if(k==0){const c=Object.keys(CATS)[Math.random()*5|0],pl=pickItems(c,t.length);S.tc=c;S.tbi=[];t.forEach((id,q)=>S.tbi[id]=pl[q]);S.tg={}}
if(k>=t.length)return tbVote(0);const id=t[k];scr(`<div class="cd c"><h2>جولة التعادل - ${CATS[S.tc].n}</h2><div style="font-size:26px;font-weight:900">سلم الجوال إلى:<br><span class="y">${nm(id)}</span></div><div id="rb"><button class="b1" onclick="tbRv(${k})">كشف</button></div></div>`,'none')}
function tbRv(k){const id=S.tid[k];$('rb').innerHTML=`<div class="sec"><small class="mu">${X[S.tc][0]} في جولة التعادل</small><b>${esc(S.tbi[id])}</b></div><button class="b1" style="margin-top:12px" onclick="tbGo(${k+1})">تم، حفظت ✔</button>`}
function tbVote(k){const t=S.tid;if(k>=t.length)return tbEnd();const id=t[k],o=mkOpts(id,t,S.tbi,S.tc);scr(`<div class="cd"><h2>${nm(id)}، خمّن ${X[S.tc][2]} الباقين</h2>${t.map(j=>j==id?'':`<label style="font-weight:800;font-size:14px">${nm(j)}<select class="gs" id="g${j}" onchange="dis()"><option value="">— اختر —</option>${o.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>`).join('')}</div><button class="b1" onclick="tbSub(${k})">تأكيد ✔</button>`,'none')}
function tbSub(k){const t=S.tid,id=t[k];let c=0;for(const j of t)if(j!=id){const v=$('g'+j).value;if(!v)return alert('اختر لكل لاعب');if(v===S.tbi[j])c++}S.tg[id]=c;tbVote(k+1)}
function tbEnd(){const t=S.tid,v=t.map(i=>S.tg[i]),mx=Math.max(...v),mn=Math.min(...v);S.tw=mx>mn?t.filter(i=>S.tg[i]==mx):[];S.tbd=1;scr(`<div class="cd"><h2>نتيجة جولة التعادل</h2>${t.map(i=>`<div class="rw"><span>${nm(i)} - <b class="y">${esc(S.tbi[i])}</b></span><b>${S.tg[i]} إصابة</b></div>`).join('')}<p class="mu c">${S.tw.length?'الفائز في جولة التعادل: '+S.tw.map(nm).join(' و '):'تعادل مرة ثانية: الصدارة مشتركة'}</p></div><button class="b1" onclick="podium()">عرض المراكز 🏆</button>`,'none')}
function podium(){const ks=i=>S.sc[i]+(S.tw&&S.tw.includes(i)?.5:0),all=S.pl.map((p,i)=>i).sort((a,b)=>ks(b)-ks(a)),rk=i=>1+[...new Set(all.map(ks))].filter(v=>v>ks(i)).length,G=r=>all.filter(i=>rk(i)==r),M=[['🥇','#facc15','المركز الأول'],['🥈','#cbd5e1','المركز الثاني'],['🥉','#cd7f32','المركز الثالث']],top=G(1),rest=all.filter(i=>rk(i)>3);
scr(`<div class="c"><div class="hero">🏆</div><h1>${top.length>1?'الأبطال: '+top.map(nm).join(' و '):'بطل الجلسة: '+nm(top[0])}</h1></div>${M.map((m,k)=>{const g=G(k+1);return g.length?`<div class="cd pd" style="border-color:${m[1]};padding:${24-k*6}px 18px"><div style="font-size:${36-k*7}px">${m[0]}</div><b style="color:${m[1]};text-align:center;font-size:${24-k*3}px">${g.map(nm).join(' و ')}</b><span class="mu">${m[2]} - ${S.sc[g[0]]} نقطة</span></div>`:''}).join('')}${rest.length?`<div class="cd"><h2>باقي المراكز</h2>${rest.map(i=>`<div class="rw"><span>${rk(i)}. ${nm(i)}</span><b class="y">${S.sc[i]} نقطة</b></div>`).join('')}</div>`:''}<div class="cd c"><p class="mu" style="color:var(--tx)">الرجاء تقييم اللعبة في حسابنا على تيك توك</p><a class="tk" style="justify-content:center" href="http://www.tiktok.com/@hamza_kaf" target="_blank" rel="noopener">تابعنا وقيم اللعبة على تيك توك</a></div><button class="b1" onclick="home()">العب من جديد</button>`)}
(function(){const ok=e=>{const t=e.target&&(e.target.nodeType==3?e.target.parentNode:e.target);return !!t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)};
document.addEventListener('contextmenu',e=>{if(!ok(e))e.preventDefault()});
document.addEventListener('selectstart',e=>{if(!ok(e))e.preventDefault()});
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('copy',e=>{if(!ok(e))e.preventDefault()});
window.addEventListener('keydown',e=>{const c=e.code,m=e.ctrlKey||e.metaKey;if(e.key==='F12'||(e.shiftKey&&['F5','F7','F9'].includes(e.key))||(m&&['KeyU','KeyS'].includes(c))||(m&&e.shiftKey&&['KeyI','KeyJ','KeyC','KeyK','KeyE','KeyM'].includes(c))||(e.metaKey&&e.altKey&&['KeyI','KeyJ','KeyC','KeyU'].includes(c))||(m&&['KeyC','KeyA'].includes(c)&&!ok(e))){e.preventDefault();e.stopPropagation()}},true)})();
onbeforeunload=e=>{if(S.sc&&S.r!=null)e.preventDefault()};
home();how();
</script>
